name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Deploy Contract One-Click Fix
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # এই সিঙ্গেল লাইনটি স্ক্রিপ্ট ফোল্ডারের জন্য সাময়িকভাবে মডিউল অন করবে, কিন্তু মূল কনফিগ ফাইলকে ডিস্টার্ব করবে না
        run: |
          echo '{"type": "module"}' > scripts/package.json
          npx hardhat run scripts/deploy.js --network arc_testnet

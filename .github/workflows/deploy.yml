name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install All Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev @nomicfoundation/hardhat-toolbox dotenv --legacy-peer-deps

      - name: Deploy Contract Absolute Fix
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # এটি হার্ডহ্যাটের সমস্ত ফাইল চেকিং বাইপাস করে সরাসরি নোড রানটাইম দিয়ে ইন্টারনাল এপিআই ব্যবহার করে ডেপ্লয় করবে
        run: |
          cat << 'EOF' > run-deploy.cjs
          const hre = require("hardhat");
          async function main() {
            console.log("Starting deployment on arc_testnet...");
            // আপনার আসল ডেপ্লয়মেন্ট কোডটি ব্যাকগ্রাউন্ডে রান করা হচ্ছে
            require("./scripts/deploy.js");
          }
          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          EOF
          npx hardhat run run-deploy.cjs --network arc_testnet

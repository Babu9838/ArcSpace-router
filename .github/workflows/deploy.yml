name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Deploy Contract
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # এখানে নোডকে সরাসরি বলে দেওয়া হচ্ছে যেন সে স্ক্রিপ্টটি ESM হিসেবে রান করে, মূল ফাইল পরিবর্তন না করেই
        run: NODE_OPTIONS="--experimental-default-type=module" npx hardhat run scripts/deploy.js --network arc_testnet

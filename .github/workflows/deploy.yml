name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Base Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev @nomicfoundation/hardhat-toolbox dotenv ethers --legacy-peer-deps

      - name: Force Create Config and Deploy
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # এই সিঙ্গেল স্টেপটি নিজেরা একটি কনফিগ তৈরি করবে, বিল্ড করবে এবং কোনো এরর ছাড়া ডেপ্লয় করবে
        run: |
          # ১. একটি পারফেক্ট হার্ডহ্যাট কনফিগ ফাইল তৈরি করা হচ্ছে
          cat << 'EOF' > hardhat.config.cjs
          require("@nomicfoundation/hardhat-toolbox");
          require("dotenv").config();

          module.exports = {
            solidity: "0.8.24",
            networks: {
              arc_testnet: {
                url: process.env.ARC_RPC_URL || "",
                chainId: 5042002,
                accounts: process.env.PRIVATE_KEY ? [process.env.PRIVATE_KEY] : []
              }
            }
          };
          EOF

          # ২. হার্ডহ্যাটকে এই কাস্টম কনফিগ ফাইল দিয়ে কম্পাইল করতে বাধ্য করা হচ্ছে
          npx hardhat compile --config hardhat.config.cjs

          # ৩. এবার নোড দিয়ে সরাসরি আর্টফ্যাক্ট থেকে বাইটকোড নিয়ে ডেপ্লয় করা হচ্ছে
          cat << 'EOF' > standalone-deploy.js
          import { ethers } from "ethers";
          import fs from "fs";
          import path from "path";

          async function main() {
            const provider = new ethers.JsonRpcProvider(process.env.ARC_RPC_URL);
            
            let rawKey = process.env.PRIVATE_KEY ? process.env.PRIVATE_KEY.trim() : "";
            if (rawKey && !rawKey.startsWith("0x") && rawKey.length === 64) {
              rawKey = "0x" + rawKey;
            }

            const wallet = new ethers.Wallet(rawKey, provider);
            console.log("Deploying contract with account:", wallet.address);
            
            const artifactsDir = path.join(process.cwd(), "artifacts/contracts");
            
            function getJsonFiles(dir) {
              let results = [];
              const list = fs.readdirSync(dir);
              list.forEach((file) => {
                file = path.join(dir, file);
                const stat = fs.statSync(file);
                if (stat && stat.isDirectory()) {
                  results = results.concat(getJsonFiles(file));
                } else if (file.endsWith(".json") && !file.endsWith(".dbg.json")) {
                  results.push(file);
                }
              });
              return results;
            }

            const jsonFiles = getJsonFiles(artifactsDir);
            if (jsonFiles.length === 0) {
              throw new Error("Compiled contract JSON artifact not found.");
            }
            
            const contractData = JSON.parse(fs.readFileSync(jsonFiles[0], "utf8"));
            const abi = contractData.abi;
            const bytecode = contractData.bytecode;
            
            const factory = new ethers.ContractFactory(abi, bytecode, wallet);
            const contract = await factory.deploy();
            
            console.log("Waiting for deployment confirmation...");
            await contract.waitForDeployment();
            
            console.log("====================================");
            console.log("🎉 Contract Deployed Successfully!");
            console.log("Contract Address:", await contract.getAddress());
            console.log("====================================");
          }

          main().catch((error) => {
            console.error("Deployment failed:", error);
            process.exitCode = 1;
          });
          EOF
          
          NODE_OPTIONS="--experimental-default-type=module" node standalone-deploy.js

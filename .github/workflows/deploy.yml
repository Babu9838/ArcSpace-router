name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install All Dependencies
        # মেইন ডিপেন্ডেন্সি এবং মিসিং টুলবক্স এক লাইনে কনফ্লিক্ট এড়িয়ে ইনস্টল করা হচ্ছে
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev @nomicfoundation/hardhat-toolbox @nomicfoundation/hardhat-ignition-ethers dotenv --legacy-peer-deps

      - name: Deploy Contract One-Click Fix
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # নোডের এক্সপেরিমেন্টাল মডিউল অন করে সরাসরি রান দেওয়া হচ্ছে যেন ESM ফাইল রিড করতে পারে
        run: NODE_OPTIONS="--experimental-default-type=module" npx hardhat run scripts/deploy.js --network arc_testnet

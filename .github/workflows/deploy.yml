name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Deploy Contract Guaranteed Fix
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # ১. প্রজেক্টের প্যাকেজ মডিউল ডিক্লেয়ার করা হবে
        # ২. হার্ডহ্যাটকে সরাসরি কনফিগ ফাইলের পাথ চিনিয়ে দেওয়া হবে যেন কোনো কনফ্লিক্ট না হয়
        run: |
          npm pkg set type="module"
          npx hardhat run scripts/deploy.js --network arc_testnet --config hardhat.config.js

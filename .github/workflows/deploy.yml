name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Configure ESM Project
        # ১. এটি package.json-এ "type": "module" যোগ করবে
        # ২. লিনাক্স কমান্ড (mv) দিয়ে hardhat.config.js-কে অটোমেটিক hardhat.config.cjs বানিয়ে দেবে
        run: |
          npm pkg set type="module"
          if [ -f "hardhat.config.js" ]; then
            mv hardhat.config.js hardhat.config.cjs
          fi

      - name: Deploy Contract
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # এবার সঠিক নেটওয়ার্ক এবং কনফিগারেশন নিয়ে রান হবে
        run: npx hardhat run scripts/deploy.js --network arc_testnet

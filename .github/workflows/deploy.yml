name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Fix ESM and Config Conflict
        # এই কমান্ডটি প্রজেক্টে কোনো রিনেম ছাড়াই ESM স্ক্রিপ্ট রান করতে সাহায্য করবে
        run: npm install -g sucrase

      - name: Deploy Contract
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # sucrase-node ব্যবহার করে স্ক্রিপ্টটি রান করা হচ্ছে যেন মডিউল এরর না আসে
        run: npx sucrase-node node_modules/.bin/hardhat run scripts/deploy.js --network arc_testnet

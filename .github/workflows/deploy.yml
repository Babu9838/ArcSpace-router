name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pure Deployment Tools
        run: npm install ethers solc@0.8.24 --legacy-peer-deps

      - name: Create JS Script
        # cat কমান্ডের কোনো ঝামেলা ছাড়া একদম নিরাপদ উপায়ে ফাইল তৈরি করা হচ্ছে
        run: |
          echo 'const { ethers } = require("ethers");' > engine-deploy.cjs
          echo 'const solc = require("solc");' >> engine-deploy.cjs
          echo 'const fs = require("fs");' >> engine-deploy.cjs
          echo 'const path = require("path");' >> engine-deploy.cjs
          echo 'async function main() {' >> engine-deploy.cjs
          echo '    const provider = new ethers.JsonRpcProvider(process.env.ARC_RPC_URL);' >> engine-deploy.cjs
          echo '    let rawKey = process.env.PRIVATE_KEY ? process.env.PRIVATE_KEY.trim() : "";' >> engine-deploy.cjs
          echo '    if (rawKey && !rawKey.startsWith("0x") && rawKey.length === 64) { rawKey = "0x" + rawKey; }' >> engine-deploy.cjs
          echo '    const wallet = new ethers.Wallet(rawKey, provider);' >> engine-deploy.cjs
          echo '    console.log("🚀 Wallet address verified:", wallet.address);' >> engine-deploy.cjs
          echo '    const contractsDir = path.join(process.cwd(), "contracts");' >> engine-deploy.cjs
          echo '    const files = fs.readdirSync(contractsDir);' >> engine-deploy.cjs
          echo '    const solFile = files.find(f => f.endsWith(".sol"));' >> engine-deploy.cjs
          echo '    console.log("📦 Compiling:", solFile);' >> engine-deploy.cjs
          echo '    const source = fs.readFileSync(path.join(contractsDir, solFile), "utf8");' >> engine-deploy.cjs
          echo '    const input = { language: "Solidity", sources: { [solFile]: { content: source } }, settings: { outputSelection: { "*": { "*": ["abi", "evm.bytecode.object"] } } } };' >> engine-deploy.cjs
          echo '    const output = JSON.parse(solc.compile(JSON.stringify(input)));' >> engine-deploy.cjs
          echo '    const contractName = Object.keys(output.contracts[solFile])[0];' >> engine-deploy.cjs
          echo '    const contractData = output.contracts[solFile][contractName];' >> engine-deploy.cjs
          echo '    console.log("⚡ Deploying contract:", contractName);' >> engine-deploy.cjs
          echo '    const factory = new ethers.ContractFactory(contractData.abi, contractData.evm.bytecode.object, wallet);' >> engine-deploy.cjs
          echo '    const contract = await factory.deploy();' >> engine-deploy.cjs
          echo '    await contract.waitForDeployment();' >> engine-deploy.cjs
          echo '    console.log("====================================");' >> engine-deploy.cjs
          echo '    console.log("🎉 SUCCESS! Address:", await contract.getAddress());' >> engine-deploy.cjs
          echo '    console.log("====================================");' >> engine-deploy.cjs
          echo '}' >> engine-deploy.cjs
          echo 'main().catch((error) => { console.error("❌ Error:", error); process.exitCode = 1; });' >> engine-deploy.cjs

      - name: Run Pure JS Engine
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # ফাইলটি সরাসরি CommonJS (.cjs) হিসেবে এক্সিকিউট হবে, ফলে কোনো লুপ বা হ্যাং হওয়ার সুযোগ নেই
        run: node engine-deploy.cjs

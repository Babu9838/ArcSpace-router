name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Complete One-Click Fix
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # ১. পুরো প্রজেক্ট মডিউল করা হবে
        # ২. কনফিগ ফাইলটিকে সাময়িকভাবে .cjs করা হবে যেন হার্ডহ্যাট এরর না দেয়
        run: |
          npm pkg set type="module"
          if [ -f "hardhat.config.js" ]; then
            mv hardhat.config.js hardhat.config.cjs
          fi
          npx hardhat run scripts/deploy.js --network arc_testnet

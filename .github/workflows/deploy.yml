name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Base Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Missing Toolbox
        # এরর দূর করার জন্য হার্ডহ্যাটের লেটেস্ট টুলবক্স এবং প্লাগইনগুলো গিটহাবে রান টাইমে ইনস্টল করে নেওয়া হচ্ছে
        run: npm install --save-dev @nomicfoundation/hardhat-toolbox @nomicfoundation/hardhat-ignition-ethers dotenv

      - name: Deploy Contract One-Click Fix
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # কোনো মডিউল বা পাথ এরর ছাড়াই নোডের এক্সপেরিমেন্টাল মডিউল অন করে সরাসরি রান করা হচ্ছে
        run: NODE_OPTIONS="--experimental-default-type=module" npx hardhat run scripts/deploy.js --network arc_testnet

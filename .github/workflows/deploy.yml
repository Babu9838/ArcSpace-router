name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pure Core Tools
        run: npm install ethers solc@0.8.24 --legacy-peer-deps

      - name: Force Project CommonJS
        run: npm pkg set type="commonjs"

      - name: Deploy via Universal Bridge Engine
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          cat << 'EOF' > universal-deploy.js
          const { ethers } = require("ethers");
          const solc = require("solc");
          const fs = require("fs");
          const path = require("path");

          async function main() {
              // ⚠️ ঠিক নিচের সিঙ্গেল কোটের ('') ভেতরে আপনার নিজের সঠিক Arc RPC URL-টি পেস্ট করুন
              let rpcUrl = 'https://rpc.testnet.arc.network';
              
              if (rpcUrl.includes("your-link-here") || rpcUrl.includes("এখানে_বসাবেন")) {
                  throw new Error("Please replace the placeholder with your actual live RPC URL!");
              }

              const provider = new ethers.JsonRpcProvider(rpcUrl);
              let rawKey = process.env.PRIVATE_KEY ? process.env.PRIVATE_KEY.trim() : "";
              if (rawKey && !rawKey.startsWith("0x") && rawKey.length === 64) {
                  rawKey = "0x" + rawKey;
              }
              const wallet = new ethers.Wallet(rawKey, provider);
              console.log("🚀 Bridge Engine Ready. Wallet Verified:", wallet.address);

              const contractsDir = path.join(process.cwd(), "contracts");
              const files = fs.readdirSync(contractsDir);
              const solFile = files.find(f => f.endsWith(".sol"));
              
              if (!solFile) throw new Error("No Solidity contract file found!");
              console.log("📦 Compiling file directly:", solFile);

              const source = fs.readFileSync(path.join(contractsDir, solFile), "utf8");
              const input = {
                  language: "Solidity",
                  sources: { [solFile]: { content: source } },
                  settings: { outputSelection: { "*": { "*": ["abi", "evm.bytecode.object"] } } }
              };

              const output = JSON.parse(solc.compile(JSON.stringify(input)));
              const contractName = Object.keys(output.contracts[solFile])[0];
              const contractData = output.contracts[solFile][contractName];

              const abi = contractData.abi;
              const bytecode = contractData.evm.bytecode.object;

              console.log("⚡ Deploying Contract:", contractName);
              const factory = new ethers.ContractFactory(abi, bytecode, wallet);
              
              const contract = await factory.deploy();
              console.log("⏳ Syncing with blockchain...");
              await contract.waitForDeployment();

              console.log("====================================");
              console.log("🎉 SUCCESS! Smart Contract Successfully Live!");
              console.log("Contract Address:", await contract.getAddress());
              console.log("====================================");
          }

          main().catch((err) => {
              console.error("❌ Fatal Error:", err.message);
              process.exit(1);
          });
          EOF

          node universal-deploy.js

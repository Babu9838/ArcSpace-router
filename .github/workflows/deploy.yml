name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Fixed ESM Configuration
        # গিটহাব নিজেই hardhat.config.js ফাইলটিকে সাময়িকভাবে .cjs বানিয়ে দেবে
        # এবং প্রজেক্টকে মডিউল হিসেবে সেট করবে, যাতে কোনো ফাইল মিসিং বা মডিউল এরর না আসে
        run: |
          npm pkg set type="module"
          if [ -f "hardhat.config.js" ]; then
            mv hardhat.config.js hardhat.config.cjs
          fi

      - name: Deploy Contract
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # কনফিগ ফাইলের নতুন পাথ সরাসরি নির্দিষ্ট করে দেওয়া হলো যেন একবারে রান হয়
        run: npx hardhat run scripts/deploy.js --network arc_testnet --config hardhat.config.cjs

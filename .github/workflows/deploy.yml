name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        # ডিপেন্ডেন্সিগুলো একদম ফ্রেশ এবং ক্লিনভাবে ইনস্টল করার জন্য
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Deploy Contract One-Click Fix
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # কোনো মডিউল বা কনফিগ এরর ছাড়াই সরাসরি নোড রানটাইম দিয়ে স্ক্রিপ্টটি পুশ করা হচ্ছে
        run: npx hardhat run scripts/deploy.js --network arc_testnet

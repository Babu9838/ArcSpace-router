name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev @nomicfoundation/hardhat-toolbox dotenv ethers --legacy-peer-deps

      - name: Reset Package Type
        # প্রজেক্টের মডিউল টাইপ নিয়ে যেন হার্ডহ্যাট কোনো এরর না দেয়, তাই টাইপ ডিলেট করে দেওয়া হচ্ছে
        run: npm pkg delete type

      - name: Deploy Contract Guaranteed
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARC_RPC_URL: ${{ secrets.RPC_URL }}
        # গিটহাবের রুটেই একটি সাধারণ হার্ডহ্যাট কনফিগ দিয়ে রান করা হচ্ছে, যা সর্বোচ্চ ১-২ মিনিটে শেষ হবে
        run: |
          echo 'require("@nomicfoundation/hardhat-toolbox"); require("dotenv").config(); module.exports = { solidity: "0.8.24", networks: { arc_testnet: { url: process.env.ARC_RPC_URL, chainId: 5042002, accounts: [process.env.PRIVATE_KEY] } } };' > hardhat.config.js
          npx hardhat run scripts/deploy.js --network arc_testnet

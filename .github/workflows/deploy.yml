name: Deploy Arc

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        # এখানে --legacy-peer-deps যুক্ত করা হয়েছে যেন ভার্সন অমিল থাকলেও ফোর্স ইনস্টল হয়
        run: npm install --legacy-peer-deps

      - name: Deploy
        run: echo Done

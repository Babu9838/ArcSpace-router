<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcSpace PRO Dashboard</title>
    <style>
        /* Dashboard er main background ebong font */
        body {
            background-color: #0d1321; /* Dark theme background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Header container (Logo ebong text ekline-e rakhar jonno) */
        .dashboard-header {
            display: flex;
            align-items: center; 
            gap: 12px;           
            margin-bottom: 25px;
        }

        /* Logo Style */
        .dashboard-logo {
            width: 32px;         
            height: 32px;
            border-radius: 6px;  
            object-fit: cover;
        }

        /* Heading Text Style */
        .dashboard-title {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin: 0;
        }

        /* Card ba Section Design */
        .card {
            background-color: #131a2e;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            border: 1px solid #1e2942;
        }

        /* Connect Wallet Button Style */
        .btn-connect {
            background-color: #3b30b4;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-connect:hover {
            background-color: #4c3ee3;
        }

        /* Wallet connect hole button er shobuj color style */
        .btn-connect.connected {
            background-color: #10b981; 
        }

        .status-text {
            font-size: 0.85rem;
            color: #8fa0dd;
            margin-top: 8px;
            word-break: break-all;
        }

        /* Dropdown ebong Input field */
        label {
            display: block;
            font-size: 0.9rem;
            color: #8fa0dd;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-family: inherit;
        }

        select {
            cursor: pointer;
        }

        /* Action buttons */
        .btn-action {
            background-color: #4338ca;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Balance Layout */
        .balance-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .balance-item span {
            display: block;
            font-size: 0.85rem;
            color: #8fa0dd;
        }

        .balance-item strong {
            font-size: 1.1rem;
        }

        /* Liquidity Grid Column Setup */
        .liquidity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <img src="1000236378.jpg" alt="ArcSpace Logo" class="dashboard-logo">
        <h1 class="dashboard-title">ArcSpace PRO Dashboard</h1>
    </div>

    <div class="card">
        <button id="connectBtn" class="btn-connect">Connect Wallet</button>
        <div id="walletStatus" class="status-text">Not Connected</div>
    </div>

    <div class="card">
        <label for="networkSelect">Network Switch</label>
        <select id="networkSelect">
            <option value="0x1f4" selected>Arc Testnet</option> <option value="0xaa36a7">Sepolia Testnet</option> <option value="0x66eee">Arbitrum Sepolia</option> </select>
        <div id="networkStatus" class="status-text" style="color: #e11d48;"></div>
    </div>

    <div class="card">
        <label>Unified Balance</label>
        <div style="font-size: 0.9rem; margin-bottom: 10px;">ETH: 0</div>
        <div class="balance-grid">
            <div class="balance-item">
                <span>USDC</span>
                <strong>0</strong>
            </div>
            <div class="balance-item">
                <span>EURC</span>
                <strong>0</strong>
            </div>
            <div class="balance-item">
                <span>cirBTC</span>
                <strong>0</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Token Transfer</label>
        <select><option>USDC</option></select>
        <input type="text" placeholder="Receiver">
        <input type="text" placeholder="Amount">
        <button class="btn-action">Send</button>
    </div>

    <div class="card">
        <label>Swap</label>
        <select><option>USDC</option></select>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Swap</button>
    </div>

    <div class="card">
        <label>Bridge</label>
        <select><option>Arc -> Ethereum</option></select>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Bridge</button>
    </div>

    <div class="card">
        <label>Liquidity</label>
        <div class="liquidity-grid">
            <div>
                <span style="font-size: 0.85rem; color:#8fa0dd; display:block; margin-bottom:5px;">Add Liquidity</span>
                <input type="text" placeholder="Token A">
                <input type="text" placeholder="Token B">
                <button class="btn-action">Add</button>
            </div>
            <div>
                <span style="font-size: 0.85rem; color:#8fa0dd; display:block; margin-bottom:5px;">Remove Liquidity</span>
                <input type="text" placeholder="LP Token">
                <button class="btn-action" style="background-color: #3b30b4;">Remove</button>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Stake</label>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Stake</button>
    </div>


    <script>
        const connectBtn = document.getElementById('connectBtn');
        const walletStatus = document.getElementById('walletStatus');
        const networkSelect = document.getElementById('networkSelect');
        const networkStatus = document.getElementById('networkStatus');

        let isConnected = false;

        // Custom Network Configuration (Arc Testnet jodi MetaMask e add na thake tar data)
        const networkParams = {
            "0x1f4": {
                chainId: "0x1f4",
                chainName: "Arc Testnet",
                rpcUrls: ["https://rpc.arc-testnet.io"], // Ekhane apnar actual RPC url hobe
                nativeCurrency: { name: "ARC", symbol: "ARC", decimals: 18 },
                blockExplorerUrls: ["https://explorer.arc-testnet.io"]
            },
            "0xaa36a7": {
                chainId: "0xaa36a7",
                chainName: "Sepolia Testnet",
                rpcUrls: ["https://rpc.sepolia.org"],
                nativeCurrency: { name: "SepoliaETH", symbol: "ETH", decimals: 18 },
                blockExplorerUrls: ["https://sepolia.etherscan.io"]
            },
            "0x66eee": {
                chainId: "0x66eee",
                chainName: "Arbitrum Sepolia",
                rpcUrls: ["https://sepolia-rollup.arbitrum.io/rpc"],
                nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
                blockExplorerUrls: ["https://sepolia.arbiscan.io"]
            }
        };

        // Wallet Connection Function
        async function initWalletConnect() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    walletStatus.innerText = "Connecting...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const userAddress = accounts[0];
                    const dottedAddress = userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
                    
                    connectBtn.innerText = "Wallet Connected";
                    connectBtn.classList.add('connected');
                    walletStatus.innerText = "Connected: " + dottedAddress;
                    isConnected = true;

                    // Connection er por active network check kora
                    checkCurrentNetwork();
                } catch (err) {
                    console.error(err);
                    walletStatus.innerText = "Connection rejected.";
                    connectBtn.innerText = "Connect Wallet";
                }
            } else {
                walletStatus.innerText = "MetaMask not found!";
                alert("Please install MetaMask extension.");
            }
        }

        // Current Network Check Function
        async function checkCurrentNetwork() {
            if (typeof window.ethereum !== 'undefined' && isConnected) {
                const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
                
                // Select element-ke wallet er actual chain standard e sync kora
                if (document.querySelector(`#networkSelect option[value="${currentChainId}"]`)) {
                    networkSelect.value = currentChainId;
                    networkStatus.innerText = ""; // Clear errors
                } else {
                    networkStatus.innerText = "Unsupported Network! Please switch from dropdown.";
                }
            }
        }

        // Network Switch Function
        async function switchNetwork(chainId) {
            if (typeof window.ethereum !== 'undefined' && isConnected) {
                try {
                    // Prothome check korbe common network kina (Hex parameter diye switch request)
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: chainId }],
                    });
                    networkStatus.innerText = "";
                } catch (switchError) {
                    // Jodi network MetaMask e add na thake (Error code: 4902)
                    if (switchError.code === 4902) {
                        try {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [networkParams[chainId]],
                            });
                            networkStatus.innerText = "";
                        } catch (addError) {
                            console.error("Could not add network:", addError);
                        }
                    } else {
                        console.error("Could not switch network:", switchError);
                        // Switch fail hole wallet er real network e dropdown back korbe
                        checkCurrentNetwork();
                    }
                }
            } else if (!isConnected) {
                alert("Please connect your wallet first!");
                networkSelect.value = "0x1f4"; // Default back to Arc
            }
        }

        // Event Listeners
        connectBtn.addEventListener('click', initWalletConnect);
        
        networkSelect.addEventListener('change', (e) => {
            switchNetwork(e.target.value);
        });

        // Wallet active chain change hole autodetect hobe
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('chainChanged', (chainId) => {
                networkSelect.value = chainId;
                checkCurrentNetwork();
            });
            window.ethereum.on('accountsChanged', (accounts) => {
                if(accounts.length === 0) {
                    isConnected = false;
                    connectBtn.innerText = "Connect Wallet";
                    connectBtn.classList.remove('connected');
                    walletStatus.innerText = "Not Connected";
                    networkStatus.innerText = "";
                } else {
                    initWalletConnect();
                }
            });
        }

        // Auto check on page reload
        window.addEventListener('load', async () => {
            if (typeof window.ethereum !== 'undefined') {
                const activeAccounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (activeAccounts.length > 0) {
                    initWalletConnect();
                }
            }
        });
    </script>

</body>
</html>

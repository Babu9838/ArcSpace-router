<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArcSpace PRO</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0b0f19;color:white}
.container{padding:15px}

.card{
  background:#111827;
  padding:15px;
  border-radius:12px;
  margin:10px 0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:768px){
  .grid{grid-template-columns:1fr}
}

input,select{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#4f46e5;
  color:white;
  cursor:pointer;
  margin-top:8px;
}

.small{opacity:0.7;font-size:12px}
</style>
</head>

<body>

<div class="container">

<h2>🚀 ArcSpace PRO Dashboard</h2>

<!-- WALLET -->
<div class="card">
  <button onclick="connectWallet()">Connect Wallet</button>
  <p id="wallet">Not Connected</p>
</div>

<!-- NETWORK -->
<div class="card">
  <h3>Network Switch</h3>
  <select id="network">
    <option>Arc Testnet</option>
    <option>Ethereum</option>
    <option>Sepolia</option>
    <option>Arbitrum</option>
  </select>
</div>

<!-- UNIFIED BALANCE -->
<div class="card">
  <h3>Unified Balance</h3>
  <p id="eth">ETH: 0</p>

  <div class="grid">
    <div class="card">USDC<br><b id="usdc">0</b></div>
    <div class="card">EURC<br><b id="eurc">0</b></div>
    <div class="card">cirBTC<br><b id="btc">0</b></div>
  </div>
</div>

<!-- TOKEN TRANSFER -->
<div class="card">
  <h3>Token Transfer</h3>
  <select id="token">
    <option>USDC</option>
    <option>EURC</option>
    <option>cirBTC</option>
  </select>

  <input id="to" placeholder="Receiver">
  <input id="amount" placeholder="Amount">

  <button onclick="sendToken()">Send</button>
</div>

<!-- SWAP -->
<div class="card">
  <h3>Swap</h3>
  <select>
    <option>USDC</option>
    <option>EURC</option>
    <option>cirBTC</option>
  </select>

  <input placeholder="Amount">
  <button>Swap</button>
</div>

<!-- BRIDGE -->
<div class="card">
  <h3>Bridge</h3>
  <select>
    <option>Arc → Ethereum</option>
    <option>Ethereum → Arbitrum</option>
    <option>Arc → Sepolia</option>
  </select>

  <input placeholder="Amount">
  <button>Bridge</button>
</div>

<!-- LIQUIDITY -->
<div class="card">
  <h3>Liquidity</h3>

  <div class="grid">
    <div>
      <h4>Add Liquidity</h4>
      <input placeholder="Token A">
      <input placeholder="Token B">
      <button>Add</button>
    </div>

    <div>
      <h4>Remove Liquidity</h4>
      <input placeholder="LP Token">
      <button>Remove</button>
    </div>
  </div>
</div>

<!-- STAKE -->
<div class="card">
  <h3>Stake</h3>
  <input placeholder="Amount">
  <button>Stake</button>
</div>

<!-- ANALYTICS -->
<div class="card">
  <h3>Analytics</h3>
  <canvas id="chart" width="300" height="120"></canvas>
</div>

<!-- SOCIAL -->
<div class="card">
  <h3>Social Connect</h3>
  <button>Twitter</button>
  <button>Discord</button>
  <button>GitHub</button>
</div>

</div>

<script>

let provider;
let signer;
let user;

const TOKENS = {
  USDC:"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48",
  EURC:"0x0000000000000000000000000000000000000000",
  cirBTC:"0x0000000000000000000000000000000000000000"
};

const ABI = [
  "function transfer(address to, uint amount) returns (bool)",
  "function balanceOf(address) view returns (uint)"
];

// CONNECT
async function connectWallet(){
  if(!window.ethereum){
    alert("Install MetaMask");
    return;
  }

  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();
  user = await signer.getAddress();

  document.getElementById("wallet").innerText = user;

  loadBalances();
}

// BALANCES
async function loadBalances(){

  const ethBal = await provider.getBalance(user);
  document.getElementById("eth").innerText =
    "ETH: " + ethers.formatEther(ethBal);

  loadToken("USDC","usdc");
  loadToken("EURC","eurc");
  loadToken("cirBTC","btc");
}

async function loadToken(symbol,id){
  try{
    const c = new ethers.Contract(TOKENS[symbol],ABI,provider);
    const b = await c.balanceOf(user);
    document.getElementById(id).innerText =
      ethers.formatUnits(b,6);
  }catch(e){
    document.getElementById(id).innerText="0";
  }
}

// SEND TOKEN
async function sendToken(){
  const token=document.getElementById("token").value;
  const to=document.getElementById("to").value;
  const amount=document.getElementById("amount").value;

  const c=new ethers.Contract(TOKENS[token],ABI,signer);

  const tx=await c.transfer(to,ethers.parseUnits(amount,6));
  await tx.wait();

  alert("Success: "+tx.hash);
  loadBalances();
}

// SIMPLE CHART
const c=document.getElementById("chart");
const ctx=c.getContext("2d");
ctx.fillStyle="#4f46e5";
ctx.fillRect(20,60,40,40);
ctx.fillRect(80,30,40,70);
ctx.fillRect(140,50,40,50);

</script>

</body>
</html>

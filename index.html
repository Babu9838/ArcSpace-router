<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcSpace PRO Dashboard</title>
    <style>
        /* পুরো ড্যাশবোর্ডের ব্যাকগ্রাউন্ড এবং মূল ফন্ট */
        body {
            background-color: #0d1321; /* ডার্ক থিম ব্যাকগ্রাউন্ড */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* হেডার কন্টেইনার (লোগো এবং টেক্সট একসাথে রাখার জন্য) */
        .dashboard-header {
            display: flex;
            align-items: center; /* লোগো এবং টেক্সট সোজা লাইনে রাখার জন্য */
            gap: 12px;           /* লোগো ও লেখার মাঝখানের দূরত্ব */
            margin-bottom: 25px;
        }

        /* লোগো স্টাইল */
        .dashboard-logo {
            width: 28px;         /* লোগোর সাইজ */
            height: 28px;
            object-fit: contain;
        }

        /* হেডিং টেক্সট স্টাইল */
        .dashboard-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin: 0;
        }

        /* কার্ড বা সেকশন ডিজাইন (আপনার ইমেজের মতো) */
        .card {
            background-color: #131a2e;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            border: 1px solid #1e2942;
        }

        /* কানেক্ট ওয়ালেট বাটন */
        .btn-connect {
            background-color: #3b30b4;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .status-text {
            font-size: 0.85rem;
            color: #8fa0dd;
            margin-top: 8px;
        }

        /* ড্রপডাউন এবং ইনপুট ফিল্ড */
        label {
            display: block;
            font-size: 0.9rem;
            color: #8fa0dd;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        /* অ্যাকশন বাটনসমূহ (Send, Swap, Bridge ইত্যাদি) */
        .btn-action {
            background-color: #4338ca;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* ব্যালেন্স গ্রিড লেআউট */
        .balance-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .balance-item span {
            display: block;
            font-size: 0.85rem;
            color: #8fa0dd;
        }

        .balance-item strong {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <img src="1000236378.jpg" alt="ArcSpace Logo" class="dashboard-logo">
        <h1 class="dashboard-title">ArcSpace PRO Dashboard</h1>
    </div>

    <div class="card">
        <button class="btn-connect">Connect Wallet</button>
        <div class="status-text">Not Connected</div>
    </div>

    <div class="card">
        <label>Network Switch</label>
        <select>
            <option>Arc Testnet</option>
        </select>
    </div>

    <div class="card">
        <label>Unified Balance</label>
        <div style="font-size: 0.9rem; margin-bottom: 10px;">ETH: 0</div>
        <div class="balance-grid">
            <div class="balance-item">
                <span>USDC</span>
                <strong>0</strong>
            </div>
            <div class="balance-item">
                <span>EURC</span>
                <strong>0</strong>
            </div>
            <div class="balance-item">
                <span>cirBTC</span>
                <strong>0</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Token Transfer</label>
        <select><option>USDC</option></select>
        <input type="text" placeholder="Receiver">
        <input type="text" placeholder="Amount">
        <button class="btn-action">Send</button>
    </div>

    <div class="card">
        <label>Swap</label>
        <select><option>USDC</option></select>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Swap</button>
    </div>

    <div class="card">
        <label>Bridge</label>
        <select><option>Arc -> Ethereum</option></select>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Bridge</button>
    </div>

</body>
</html>

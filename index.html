<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArcSpace PRO</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0b0f19;color:white}
.container{padding:15px}
.card{background:#111827;padding:15px;border-radius:12px;margin:10px 0}
input,select{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:none}
button{padding:10px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer;margin-top:8px}
</style>
</head>

<body>

<div class="container">

<h2>🚀 ArcSpace PRO Dashboard</h2>

<!-- WALLET -->
<div class="card">
  <button onclick="connectWallet()">Connect Wallet</button>
  <p id="wallet">Not Connected</p>
</div>

<!-- NETWORK SWITCH -->
<div class="card">
  <h3>Network Switch</h3>

  <select id="network" onchange="switchNetwork()">

    <!-- NEW ARC TESTNET ADDED -->
    <option value="0xA1B2C3">Arc Testnet</option>

    <option value="0x1">Ethereum Mainnet</option>
    <option value="0xaa36a7">Sepolia Testnet</option>
    <option value="0xa4b1">Arbitrum One</option>

  </select>
</div>

<!-- BALANCE -->
<div class="card">
  <h3>Unified Balance</h3>
  <p id="balance">0 ETH</p>
</div>

<!-- TRANSFER -->
<div class="card">
  <h3>Token Transfer</h3>

  <select id="token">
    <option>USDC</option>
    <option>EURC</option>
    <option>cirBTC</option>
  </select>

  <input id="to" placeholder="Receiver Address">
  <input id="amount" placeholder="Amount">

  <button onclick="sendToken()">Send</button>
</div>

<!-- TX -->
<div class="card">
  <h3>Transaction Status</h3>
  <p id="tx">No transaction yet</p>
</div>

</div>

<script>

let provider;
let signer;
let user;

// token placeholders
const TOKENS = {
  USDC:"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48",
  EURC:"0x0000000000000000000000000000000000000000",
  cirBTC:"0x0000000000000000000000000000000000000000"
};

const ABI = [
  "function transfer(address to, uint amount) returns (bool)"
];

// CONNECT WALLET
async function connectWallet(){
  if(!window.ethereum){
    alert("Install MetaMask");
    return;
  }

  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();
  user = await signer.getAddress();

  document.getElementById("wallet").innerText = user;

  loadBalance();
}

// BALANCE
async function loadBalance(){
  const bal = await provider.getBalance(user);
  document.getElementById("balance").innerText =
    ethers.formatEther(bal) + " ETH";
}

// NETWORK SWITCH (UPDATED WITH ARC TESTNET SUPPORT)
async function switchNetwork(){

  const chainId = document.getElementById("network").value;

  try{

    await window.ethereum.request({
      method:"wallet_switchEthereumChain",
      params:[{chainId}]
    });

  }catch(err){

    // if network not added (Arc Testnet case)
    if(chainId === "0xA1B2C3"){

      try{
        await window.ethereum.request({
          method:"wallet_addEthereumChain",
          params:[{
            chainId: "0xA1B2C3",
            chainName: "Arc Testnet",
            nativeCurrency:{
              name:"ARC",
              symbol:"ARC",
              decimals:18
            },
            rpcUrls:["https://rpc.arc-testnet.io"], 
            blockExplorerUrls:["https://explorer.arc-testnet.io"]
          }]
        });

      }catch(e){
        alert("Arc Testnet add failed");
      }
    }
  }
}

// SEND TOKEN
async function sendToken(){

  const token = document.getElementById("token").value;
  const to = document.getElementById("to").value;
  const amount = document.getElementById("amount").value;

  if(!to || !amount){
    alert("Fill all fields");
    return;
  }

  try{

    const contract = new ethers.Contract(
      TOKENS[token],
      ABI,
      signer
    );

    const tx = await contract.transfer(
      to,
      ethers.parseUnits(amount, 6)
    );

    document.getElementById("tx").innerText =
      "Pending: " + tx.hash;

    await tx.wait();

    document.getElementById("tx").innerText =
      "Success: " + tx.hash;

  }catch(err){
    console.log(err);
    document.getElementById("tx").innerText =
      "Failed Transaction";
  }
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcSpace PRO Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        /* Dashboard main background and layout */
        body {
            background-color: #0d1321;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Header container */
        .dashboard-header {
            display: flex;
            align-items: center; 
            gap: 12px;           
            margin-bottom: 25px;
        }

        /* Logo Style */
        .dashboard-logo {
            width: 32px;         
            height: 32px;
            border-radius: 6px;  
            object-fit: cover;
        }

        /* Heading Text Style */
        .dashboard-title {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin: 0;
        }

        /* Card container */
        .card {
            background-color: #131a2e;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            border: 1px solid #1e2942;
        }

        /* Connect Wallet Button */
        .btn-connect {
            background-color: #3b30b4;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-connect:hover {
            background-color: #4c3ee3;
        }

        .btn-connect.connected {
            background-color: #10b981; 
        }

        .status-text {
            font-size: 0.85rem;
            color: #8fa0dd;
            margin-top: 8px;
            word-break: break-all;
        }

        /* Form Controls */
        label {
            display: block;
            font-size: 0.9rem;
            color: #8fa0dd;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-family: inherit;
        }

        /* Actions */
        .btn-action {
            background-color: #4338ca;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Balance grid layout */
        .balance-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .balance-item span {
            display: block;
            font-size: 0.85rem;
            color: #8fa0dd;
        }

        .balance-item strong {
            font-size: 1.1rem;
            color: #ffffff;
        }

        /* Liquidity block */
        .liquidity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <img src="1000236378.jpg" alt="ArcSpace Logo" class="dashboard-logo">
        <h1 class="dashboard-title">ArcSpace PRO Dashboard</h1>
    </div>

    <div class="card">
        <button id="connectBtn" class="btn-connect">Connect Wallet</button>
        <div id="walletStatus" class="status-text">Not Connected</div>
    </div>

    <div class="card">
        <label for="networkSelect">Network Switch</label>
        <select id="networkSelect">
            <option value="0x1f4" selected>Arc Testnet</option> <option value="0xaa36a7">Sepolia Testnet</option> <option value="0x66eee">Arbitrum Sepolia</option> </select>
        <div id="networkStatus" class="status-text" style="color: #10b981;"></div>
    </div>

    <div class="card">
        <label>Unified Balance</label>
        <div style="font-size: 0.9rem; margin-bottom: 10px;">ETH: <strong id="ethBalance">0</strong></div>
        <div class="balance-grid">
            <div class="balance-item">
                <span>USDC</span>
                <strong id="usdcBalance">0</strong>
            </div>
            <div class="balance-item">
                <span>EURC</span>
                <strong id="eurcBalance">0</strong>
            </div>
            <div class="balance-item">
                <span>cirBTC</span>
                <strong id="cirBtcBalance">0</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Token Transfer</label>
        <select><option>USDC</option></select>
        <input type="text" placeholder="Receiver">
        <input type="text" placeholder="Amount">
        <button class="btn-action">Send</button>
    </div>

    <div class="card">
        <label>Swap</label>
        <select><option>USDC</option></select>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Swap</button>
    </div>

    <div class="card">
        <label>Bridge</label>
        <select><option>Arc -> Ethereum</option></select>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Bridge</button>
    </div>

    <div class="card">
        <label>Liquidity</label>
        <div class="liquidity-grid">
            <div>
                <span style="font-size: 0.85rem; color:#8fa0dd; display:block; margin-bottom:5px;">Add Liquidity</span>
                <input type="text" placeholder="Token A">
                <input type="text" placeholder="Token B">
                <button class="btn-action">Add</button>
            </div>
            <div>
                <span style="font-size: 0.85rem; color:#8fa0dd; display:block; margin-bottom:5px;">Remove Liquidity</span>
                <input type="text" placeholder="LP Token">
                <button class="btn-action" style="background-color: #3b30b4;">Remove</button>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Stake</label>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Stake</button>
    </div>


    <script>
        const connectBtn = document.getElementById('connectBtn');
        const walletStatus = document.getElementById('walletStatus');
        const networkSelect = document.getElementById('networkSelect');
        const networkStatus = document.getElementById('networkStatus');

        const ethBalanceEl = document.getElementById('ethBalance');
        const usdcBalanceEl = document.getElementById('usdcBalance');
        const eurcBalanceEl = document.getElementById('eurcBalance');
        const cirBtcBalanceEl = document.getElementById('cirBtcBalance');

        let isConnected = false;
        let userAddress = "";

        const minABI = ["function balanceOf(address owner) view returns (uint256)"];

        // Support configuration for 3 networks
        const networkParams = {
            "0x1f4": {
                chainId: "0x1f4",
                chainName: "Arc Testnet",
                rpcUrls: ["https://rpc.arc-testnet.io"], // Replace with actual RPC if needed
                nativeCurrency: { name: "ARC", symbol: "ARC", decimals: 18 },
                blockExplorerUrls: ["https://explorer.arc-testnet.io"]
            },
            "0xaa36a7": {
                chainId: "0xaa36a7",
                chainName: "Sepolia Testnet",
                rpcUrls: ["https://rpc.sepolia.org"],
                nativeCurrency: { name: "SepoliaETH", symbol: "ETH", decimals: 18 },
                blockExplorerUrls: ["https://sepolia.etherscan.io"]
            },
            "0x66eee": {
                chainId: "0x66eee",
                chainName: "Arbitrum Sepolia",
                rpcUrls: ["https://sepolia-rollup.arbitrum.io/rpc"],
                nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
                blockExplorerUrls: ["https://sepolia.arbiscan.io"]
            }
        };

        // Dummy token address container
        const tokenAddresses = {
            "USDC": "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238",
            "EURC": "0x0000000000000000000000000000000000000000",
            "cirBTC": "0x0000000000000000000000000000000000000000"
        };

        async function fetchBalances() {
            if (!isConnected || !userAddress) return;
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const rawEthBalance = await provider.getBalance(userAddress);
                ethBalanceEl.innerText = parseFloat(ethers.formatEther(rawEthBalance)).toFixed(4);

                // Default fallback balances if contract is unassigned
                usdcBalanceEl.innerText = "0.00";
                eurcBalanceEl.innerText = "0.00";
                cirBtcBalanceEl.innerText = "0.0000";
            } catch (err) {
                console.error("Balance fetch failed:", err);
            }
        }

        async function initWalletConnect() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    walletStatus.innerText = "Connecting...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = accounts[0];
                    const dottedAddress = userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
                    
                    connectBtn.innerText = "Wallet Connected";
                    connectBtn.classList.add('connected');
                    walletStatus.innerText = "Connected: " + dottedAddress;
                    isConnected = true;

                    checkCurrentNetwork();
                } catch (err) {
                    console.error(err);
                    walletStatus.innerText = "Connection rejected.";
                    connectBtn.innerText = "Connect Wallet";
                }
            } else {
                walletStatus.innerText = "MetaMask not found!";
            }
        }

        // Active network status control
        async function checkCurrentNetwork() {
            if (typeof window.ethereum !== 'undefined' && isConnected) {
                const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
                
                // standard format conversion to lowercase to avoid match errors
                const formattedChainId = currentChainId.toLowerCase();

                if (networkParams[formattedChainId]) {
                    networkSelect.value = formattedChainId;
                    networkStatus.style.color = "#10b981"; // Green color
                    networkStatus.innerText = "Network synced successfully.";
                    fetchBalances();
                } else {
                    networkStatus.style.color = "#e11d48"; // Red color
                    networkStatus.innerText = "Unsupported Network! Please select Arc, Sepolia, or Arbitrum Sepolia.";
                }
            }
        }

        // Active trigger to switch chains inside wallet UI
        async function switchNetwork(chainId) {
            if (typeof window.ethereum !== 'undefined' && isConnected) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: chainId }],
                    });
                    networkStatus.innerText = "";
                } catch (switchError) {
                    // If network is absent inside MetaMask (Error 4902), request to add it
                    if (switchError.code === 4902) {
                        try {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [networkParams[chainId]],
                            });
                            networkStatus.innerText = "";
                        } catch (addError) {
                            console.error("Failed to add network:", addError);
                        }
                    } else {
                        console.error("Failed to switch network:", switchError);
                        checkCurrentNetwork();
                    }
                }
            } else if (!isConnected) {
                alert("Please connect your wallet first!");
                networkSelect.value = "0x1f4"; // reset to default view if wallet is off
            }
        }

        connectBtn.addEventListener('click', initWalletConnect);
        networkSelect.addEventListener('change', (e) => switchNetwork(e.target.value));

        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('chainChanged', () => {
                checkCurrentNetwork();
            });
            window.ethereum.on('accountsChanged', (accounts) => {
                if(accounts.length === 0) {
                    isConnected = false;
                    userAddress = "";
                    connectBtn.innerText = "Connect Wallet";
                    connectBtn.classList.remove('connected');
                    walletStatus.innerText = "Not Connected";
                    networkStatus.innerText = "";
                } else {
                    userAddress = accounts[0];
                    initWalletConnect();
                }
            });
        }

        window.addEventListener('load', async () => {
            if (typeof window.ethereum !== 'undefined') {
                const activeAccounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (activeAccounts.length > 0) {
                    initWalletConnect();
                }
            }
        });
    </script>
</body>
</html>

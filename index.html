<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcSpace PRO Dashboard</title>
    <style>
        /* Dashboard er main background ebong font */
        body {
            background-color: #0d1321; /* Dark theme background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Header container (Logo ebong text ekline-e rakhar jonno) */
        .dashboard-header {
            display: flex;
            align-items: center; 
            gap: 12px;           
            margin-bottom: 25px;
        }

        /* Logo Style */
        .dashboard-logo {
            width: 32px;         
            height: 32px;
            border-radius: 6px;  
            object-fit: cover;
        }

        /* Heading Text Style */
        .dashboard-title {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin: 0;
        }

        /* Card ba Section Design */
        .card {
            background-color: #131a2e;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            border: 1px solid #1e2942;
        }

        /* Connect Wallet Button Style */
        .btn-connect {
            background-color: #3b30b4;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-connect:hover {
            background-color: #4c3ee3;
        }

        /* Wallet connect hole button er shobuj color style */
        .btn-connect.connected {
            background-color: #10b981; 
        }

        .status-text {
            font-size: 0.85rem;
            color: #8fa0dd;
            margin-top: 8px;
            word-break: break-all;
        }

        /* Dropdown ebong Input field */
        label {
            display: block;
            font-size: 0.9rem;
            color: #8fa0dd;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        /* Action buttons (Send, Swap, Bridge, Liquidity, Stake) */
        .btn-action {
            background-color: #4338ca;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Balance Layout */
        .balance-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .balance-item span {
            display: block;
            font-size: 0.85rem;
            color: #8fa0dd;
        }

        .balance-item strong {
            font-size: 1.1rem;
        }

        /* Liquidity Grid Column Setup */
        .liquidity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <img src="1000236378.jpg" alt="ArcSpace Logo" class="dashboard-logo">
        <h1 class="dashboard-title">ArcSpace PRO Dashboard</h1>
    </div>

    <div class="card">
        <button id="connectBtn" class="btn-connect">Connect Wallet</button>
        <div id="walletStatus" class="status-text">Not Connected</div>
    </div>

    <div class="card">
        <label>Network Switch</label>
        <select>
            <option>Arc Testnet</option>
        </select>
    </div>

    <div class="card">
        <label>Unified Balance</label>
        <div style="font-size: 0.9rem; margin-bottom: 10px;">ETH: 0</div>
        <div class="balance-grid">
            <div class="balance-item">
                <span>USDC</span>
                <strong>0</strong>
            </div>
            <div class="balance-item">
                <span>EURC</span>
                <strong>0</strong>
            </div>
            <div class="balance-item">
                <span>cirBTC</span>
                <strong>0</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Token Transfer</label>
        <select><option>USDC</option></select>
        <input type="text" placeholder="Receiver">
        <input type="text" placeholder="Amount">
        <button class="btn-action">Send</button>
    </div>

    <div class="card">
        <label>Swap</label>
        <select><option>USDC</option></select>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Swap</button>
    </div>

    <div class="card">
        <label>Bridge</label>
        <select><option>Arc -> Ethereum</option></select>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Bridge</button>
    </div>

    <div class="card">
        <label>Liquidity</label>
        <div class="liquidity-grid">
            <div>
                <span style="font-size: 0.85rem; color:#8fa0dd; display:block; margin-bottom:5px;">Add Liquidity</span>
                <input type="text" placeholder="Token A">
                <input type="text" placeholder="Token B">
                <button class="btn-action">Add</button>
            </div>
            <div>
                <span style="font-size: 0.85rem; color:#8fa0dd; display:block; margin-bottom:5px;">Remove Liquidity</span>
                <input type="text" placeholder="LP Token">
                <button class="btn-action" style="background-color: #3b30b4;">Remove</button>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Stake</label>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Stake</button>
    </div>


    <script>
        const connectBtn = document.getElementById('connectBtn');
        const walletStatus = document.getElementById('walletStatus');

        // Connection function
        async function initWalletConnect() {
            // Browser-e MetaMask ba kono extension ache kina check korbe
            if (typeof window.ethereum !== 'undefined') {
                try {
                    walletStatus.innerText = "Connecting...";
                    
                    // Request wallet account access
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const userAddress = accounts[0];
                    
                    // Address tike choto kore dekhano (Ex: 0x1234...abcd)
                    const dottedAddress = userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
                    
                    // UI dynamic changes
                    connectBtn.innerText = "Wallet Connected";
                    connectBtn.classList.add('connected');
                    walletStatus.innerText = "Connected Account: " + dottedAddress;
                    
                    console.log("Connected successfully to address:", userAddress);
                } catch (err) {
                    console.error("User denied account access or error occurred:", err);
                    walletStatus.innerText = "Connection rejected.";
                    connectBtn.innerText = "Connect Wallet";
                }
            } else {
                // Extension na thakle warning dekhabe
                walletStatus.innerText = "Wallet extension not found! Please install MetaMask.";
                alert("Please install MetaMask extension to connect your wallet.");
            }
        }

        // Button click event listener
        connectBtn.addEventListener('click', initWalletConnect);

        // Auto check if already connected on page refresh
        window.addEventListener('load', async () => {
            if (typeof window.ethereum !== 'undefined') {
                const activeAccounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (activeAccounts.length > 0) {
                    const dottedAddress = activeAccounts[0].substring(0, 6) + "..." + activeAccounts[0].substring(activeAccounts[0].length - 4);
                    connectBtn.innerText = "Wallet Connected";
                    connectBtn.classList.add('connected');
                    walletStatus.innerText = "Connected Account: " + dottedAddress;
                }
            }
        });
    </script>

</body>
</html>

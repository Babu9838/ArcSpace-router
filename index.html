<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArcSpace Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.min.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f19;
  color:white;
  transition:0.3s;
}

.light {
  background:#f4f6ff;
  color:#111;
}

.nav {
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#111827;
}

.card {
  background:#111827;
  padding:15px;
  margin:10px;
  border-radius:12px;
}

.light .card {
  background:white;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn {
  background:#4f46e5;
  color:white;
}

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
}

@media(max-width:768px){
  .grid{grid-template-columns:1fr;}
}

input, select {
  width:100%;
  padding:8px;
  margin-top:5px;
}

.small {
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="nav">
  <div><b>🚀 ArcSpace</b></div>

  <div>
    <button onclick="toggleDark()">🌙</button>
    <button class="btn" onclick="connectWallet()">Wallet Connect</button>
  </div>
</div>

<!-- NETWORK -->
<div class="card">
  <h3>Network Switch</h3>
  <select id="network">
    <option>Arc Testnet</option>
    <option>Sepolia</option>
    <option>Arbitrum Sepolia</option>
  </select>
</div>

<!-- UNIFIED BALANCE -->
<div class="card">
  <h3>Unified Balance</h3>
  <h2 id="balance">$12,840.45</h2>

  <div class="grid">
    <div class="card">USDC<br><b>2500</b></div>
    <div class="card">EURC<br><b>1850</b></div>
    <div class="card">cirBTC<br><b>0.085</b></div>
  </div>
</div>

<!-- TRANSFER -->
<div class="card">
  <h3>Token Transfer</h3>

  <select id="token">
    <option>USDC</option>
    <option>EURC</option>
    <option>cirBTC</option>
  </select>

  <input id="to" placeholder="Receiver Address">
  <input id="amount" placeholder="Amount">

  <button class="btn" onclick="sendToken()">Send</button>
</div>

<!-- PORTFOLIO -->
<div class="card">
  <h3>Portfolio Tracker</h3>
  <canvas id="chart" width="300" height="150"></canvas>
</div>

<!-- ANALYTICS -->
<div class="card">
  <h3>Analytics</h3>
  <p class="small">Volume / Activity Chart</p>
  <canvas id="chart2" width="300" height="150"></canvas>
</div>

<!-- TRANSACTIONS -->
<div class="card">
  <h3>Recent Transactions</h3>
  <ul id="tx">
    <li>USDC Sent → 0x123...abc</li>
    <li>EURC Received → 0x456...def</li>
  </ul>
</div>

<!-- SOCIAL -->
<div class="card">
  <h3>Social Connect</h3>
  <button class="btn">Twitter</button>
  <button class="btn">Discord</button>
  <button class="btn">GitHub</button>
</div>

<!-- SCRIPT -->
<script>
let provider;
let signer;
let dark = true;

function toggleDark(){
  document.body.classList.toggle("light");
  dark = !dark;
}

async function connectWallet(){
  if(window.ethereum){
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    alert("Wallet Connected: " + await signer.getAddress());
  } else {
    alert("Install MetaMask");
  }
}

function sendToken(){
  let token = document.getElementById("token").value;
  let to = document.getElementById("to").value;
  let amount = document.getElementById("amount").value;

  if(!to || !amount){
    alert("Fill fields");
    return;
  }

  let li = document.createElement("li");
  li.innerText = `${token} Sent → ${to.slice(0,6)}...`;
  document.getElementById("tx").appendChild(li);

  alert("Transaction simulated (UI level)");
}

/* SIMPLE CHARTS */
function draw(){
  let c = document.getElementById("chart");
  let ctx = c.getContext("2d");
  ctx.fillStyle = "#4f46e5";
  ctx.fillRect(20,50,40,80);
  ctx.fillRect(80,30,40,100);
  ctx.fillRect(140,70,40,60);
}

function draw2(){
  let c = document.getElementById("chart2");
  let ctx = c.getContext("2d");
  ctx.strokeStyle = "#22c55e";
  ctx.beginPath();
  ctx.moveTo(10,100);
  ctx.lineTo(60,60);
  ctx.lineTo(120,80);
  ctx.lineTo(180,40);
  ctx.stroke();
}

draw();
draw2();
</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcSpace PRO Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        /* ড্যাশবোর্ডের ব্যাকগ্রাউন্ড এবং মূল ফন্ট */
        body {
            background-color: #0d1321;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* হেডার কন্টেইনার */
        .dashboard-header {
            display: flex;
            align-items: center; 
            gap: 12px;           
            margin-bottom: 25px;
        }

        /* লোগো স্টাইল */
        .dashboard-logo {
            width: 32px;         
            height: 32px;
            border-radius: 6px;  
            object-fit: cover;
        }

        /* হেডিং টেক্সট স্টাইল */
        .dashboard-title {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin: 0;
        }

        /* কার্ড বা সেকশন ডিজাইন */
        .card {
            background-color: #131a2e;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            border: 1px solid #1e2942;
        }

        /* কানেক্ট ওয়ালেট বাটন স্টাইল */
        .btn-connect {
            background-color: #3b30b4;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-connect:hover {
            background-color: #4c3ee3;
        }

        .btn-connect.connected {
            background-color: #10b981; 
        }

        .status-text {
            font-size: 0.85rem;
            color: #8fa0dd;
            margin-top: 8px;
            word-break: break-all;
        }

        /* ড্রপডাউন এবং ইনপুট ফিল্ড */
        label {
            display: block;
            font-size: 0.9rem;
            color: #8fa0dd;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-family: inherit;
        }

        /* অ্যাকশন বাটনসমূহ */
        .btn-action {
            background-color: #4338ca;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* ব্যালেন্স গ্রিড লেআউট */
        .balance-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .balance-item span {
            display: block;
            font-size: 0.85rem;
            color: #8fa0dd;
        }

        .balance-item strong {
            font-size: 1.1rem;
            color: #ffffff;
        }

        /* লিকুইডিটি গ্রিড লেআউট */
        .liquidity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <img src="1000236378.jpg" alt="ArcSpace Logo" class="dashboard-logo">
        <h1 class="dashboard-title">ArcSpace PRO Dashboard</h1>
    </div>

    <div class="card">
        <button id="connectBtn" class="btn-connect">Connect Wallet</button>
        <div id="walletStatus" class="status-text">Not Connected</div>
    </div>

    <div class="card">
        <label for="networkSelect">Network Switch</label>
        <select id="networkSelect">
            <option value="0x1f4" selected>Arc Testnet</option>
            <option value="0xaa36a7">Sepolia Testnet</option>
            <option value="0x66eee">Arbitrum Sepolia</option>
        </select>
        <div id="networkStatus" class="status-text" style="color: #e11d48;"></div>
    </div>

    <div class="card">
        <label>Unified Balance</label>
        <div style="font-size: 0.9rem; margin-bottom: 10px;">ETH: <strong id="ethBalance">0</strong></div>
        <div class="balance-grid">
            <div class="balance-item">
                <span>USDC</span>
                <strong id="usdcBalance">0</strong>
            </div>
            <div class="balance-item">
                <span>EURC</span>
                <strong id="eurcBalance">0</strong>
            </div>
            <div class="balance-item">
                <span>cirBTC</span>
                <strong id="cirBtcBalance">0</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Token Transfer</label>
        <select><option>USDC</option></select>
        <input type="text" placeholder="Receiver">
        <input type="text" placeholder="Amount">
        <button class="btn-action">Send</button>
    </div>

    <div class="card">
        <label>Swap</label>
        <select><option>USDC</option></select>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Swap</button>
    </div>

    <div class="card">
        <label>Bridge</label>
        <select><option>Arc -> Ethereum</option></select>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Bridge</button>
    </div>

    <div class="card">
        <label>Liquidity</label>
        <div class="liquidity-grid">
            <div>
                <span style="font-size: 0.85rem; color:#8fa0dd; display:block; margin-bottom:5px;">Add Liquidity</span>
                <input type="text" placeholder="Token A">
                <input type="text" placeholder="Token B">
                <button class="btn-action">Add</button>
            </div>
            <div>
                <span style="font-size: 0.85rem; color:#8fa0dd; display:block; margin-bottom:5px;">Remove Liquidity</span>
                <input type="text" placeholder="LP Token">
                <button class="btn-action" style="background-color: #3b30b4;">Remove</button>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Stake</label>
        <input type="text" placeholder="Amount">
        <button class="btn-action">Stake</button>
    </div>


    <script>
        const connectBtn = document.getElementById('connectBtn');
        const walletStatus = document.getElementById('walletStatus');
        const networkSelect = document.getElementById('networkSelect');
        const networkStatus = document.getElementById('networkStatus');

        // ব্যালেন্স দেখানোর DOM এলিমেন্টসমূহ
        const ethBalanceEl = document.getElementById('ethBalance');
        const usdcBalanceEl = document.getElementById('usdcBalance');
        const eurcBalanceEl = document.getElementById('eurcBalance');
        const cirBtcBalanceEl = document.getElementById('cirBtcBalance');

        let isConnected = false;
        let userAddress = "";

        // ERC-20 টোকেনের ব্যালেন্স চেক করার মিনিমাম ABI 
        const minABI = [
            "function balanceOf(address owner) view returns (uint256)",
            "function decimals() view returns (uint8)"
        ];

        // আপনার নেটওয়ার্ক অনুযায়ী টোকেন কন্ট্রাক্ট অ্যাড্রেসগুলো এখানে বসাবেন (নিচে ডেমো দেওয়া হলো)
        const tokenAddresses = {
            "USDC": "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238", // ডেমো সেপোলিয়া USDC অ্যাড্রেস
            "EURC": "0x0000000000000000000000000000000000000000", // আপনার টোকেন অ্যাড্রেস বসাবেন
            "cirBTC": "0x0000000000000000000000000000000000000000" // আপনার টোকেন অ্যাড্রেস বসাবেন
        };

        // ব্যালেন্স ফetch করার মূল ফাংশন
        async function fetchBalances() {
            if (!isConnected || !userAddress) return;

            try {
                // ব্রাউজার প্রোভাইডার সেটআপ (Ethers v6)
                const provider = new ethers.BrowserProvider(window.ethereum);
                
                // ১. নেটওয়ার্কের মেইন টোকেন (ETH) ব্যালেন্স গেট করা
                const rawEthBalance = await provider.getBalance(userAddress);
                ethBalanceEl.innerText = parseFloat(ethers.formatEther(rawEthBalance)).toFixed(4);

                // ২. USDC ব্যালেন্স গেট করা
                if (tokenAddresses.USDC !== "0x0000000000000000000000000000000000000000") {
                    const usdcContract = new ethers.Contract(tokenAddresses.USDC, minABI, provider);
                    const usdcBal = await usdcContract.balanceOf(userAddress);
                    // সাধারণত USDC এর ডেসিমেল ৬ হয়, অন্য টোকেনের ১৮ হতে পারে
                    usdcBalanceEl.innerText = parseFloat(ethers.formatUnits(usdcBal, 6)).toFixed(2); 
                }

                // ৩. EURC ব্যালেন্স গেট করা
                if (tokenAddresses.EURC !== "0x0000000000000000000000000000000000000000") {
                    const eurcContract = new ethers.Contract(tokenAddresses.EURC, minABI, provider);
                    const eurcBal = await eurcContract.balanceOf(userAddress);
                    eurcBalanceEl.innerText = parseFloat(ethers.formatUnits(eurcBal, 18)).toFixed(2);
                }

                // ৪. cirBTC ব্যালেন্স গেট করা
                if (tokenAddresses.cirBTC !== "0x0000000000000000000000000000000000000000") {
                    const cirBtcContract = new ethers.Contract(tokenAddresses.cirBTC, minABI, provider);
                    const cirBtcBal = await cirBtcContract.balanceOf(userAddress);
                    cirBtcBalanceEl.innerText = parseFloat(ethers.formatUnits(cirBtcBal, 18)).toFixed(4);
                }

            } catch (err) {
                console.error("Error fetching balances:", err);
            }
        }

        // ব্যালেন্স রিসেট ফাংশন (ডিসকানেক্ট হলে)
        function resetBalances() {
            ethBalanceEl.innerText = "0";
            usdcBalanceEl.innerText = "0";
            eurcBalanceEl.innerText = "0";
            cirBtcBalanceEl.innerText = "0";
        }

        // ওয়ালেট কানেক্ট ফাংশন
        async function initWalletConnect() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    walletStatus.innerText = "Connecting...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = accounts[0];
                    const dottedAddress = userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
                    
                    connectBtn.innerText = "Wallet Connected";
                    connectBtn.classList.add('connected');
                    walletStatus.innerText = "Connected: " + dottedAddress;
                    isConnected = true;

                    checkCurrentNetwork();
                    fetchBalances(); // কানেক্ট হওয়ার সাথে সাথে ব্যালেন্স লোড হবে
                } catch (err) {
                    console.error(err);
                    walletStatus.innerText = "Connection rejected.";
                    connectBtn.innerText = "Connect Wallet";
                }
            } else {
                walletStatus.innerText = "MetaMask not found!";
                alert("Please install MetaMask extension.");
            }
        }

        // বর্তমান নেটওয়ার্ক চেক
        async function checkCurrentNetwork() {
            if (typeof window.ethereum !== 'undefined' && isConnected) {
                const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (document.querySelector(`#networkSelect option[value="${currentChainId}"]`)) {
                    networkSelect.value = currentChainId;
                    networkStatus.innerText = "";
                    fetchBalances(); // নেটওয়ার্ক বদলালে ব্যালেন্স রি-লোড হবে
                } else {
                    networkStatus.innerText = "Unsupported Network! Please switch.";
                }
            }
        }

        // নেটওয়ার্ক সুইচ করা
        async function switchNetwork(chainId) {
            if (typeof window.ethereum !== 'undefined' && isConnected) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: chainId }],
                    });
                    networkStatus.innerText = "";
                } catch (switchError) {
                    console.error("Could not switch network:", switchError);
                    checkCurrentNetwork();
                }
            } else if (!isConnected) {
                alert("Please connect your wallet first!");
                networkSelect.value = "0x1f4";
            }
        }

        // ইভেন্ট লিসেনারস
        connectBtn.addEventListener('click', initWalletConnect);
        networkSelect.addEventListener('change', (e) => switchNetwork(e.target.value));

        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('chainChanged', () => {
                checkCurrentNetwork();
            });
            window.ethereum.on('accountsChanged', (accounts) => {
                if(accounts.length === 0) {
                    isConnected = false;
                    userAddress = "";
                    connectBtn.innerText = "Connect Wallet";
                    connectBtn.classList.remove('connected');
                    walletStatus.innerText = "Not Connected";
                    resetBalances();
                } else {
                    userAddress = accounts[0];
                    initWalletConnect();
                }
            });
        }

        // পেজ রিলোড হলে অটো-কানেক্ট চেক
        window.addEventListener('load', async () => {
            if (typeof window.ethereum !== 'undefined') {
                const activeAccounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (activeAccounts.length > 0) {
                    initWalletConnect();
                }
            }
        });
    </script>
</body>
</html>
